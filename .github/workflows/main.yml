name: CI

on:
  workflow_run:
    workflows:
      - "code linter"
    types:
      - completed

defaults:
  run:
    working-directory: 'ansible-kimai'

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'

